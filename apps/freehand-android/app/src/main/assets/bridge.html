<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Freehand</title>
<style>
/* Android WebView bridge — uses mobile-mock design tokens via CSS import.
   The server's mobile-mock.html IS NOT loaded here; this page lives in the
   Android APK assets and receives live turn data from the native SSE consumer.
   Design tokens (--bg, --text, --line, --master, --user, --assistant,
   --tool, --success, --fail, --running, --shadow) are imported from the
   same CSS that the server-side design preview uses. */
@import url("mobile-mock.css");
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; }

#conv { padding: 12px 14px 80px; display: flex; flex-direction: column; gap: 10px; }

.day-sep {
  font-size: 11px; color: #9fb0a7;
  text-align: center; padding: 10px 0 4px;
  letter-spacing: .04em; text-transform: uppercase;
}

article.turn {
  border-radius: 12px; border: 1px solid var(--line, #d7dfd9);
  background: var(--bg-2, #161d1a); padding: 10px 12px;
  border-left: 4px solid var(--assistant, #69c097);
}
article.turn.user       { border-left-color: var(--user, #7db0dd); }
article.turn.assistant  { border-left-color: var(--assistant, #69c097); }
article.turn.tool       { border-left-color: var(--tool, #d1a35c); }
article.turn.terminal   { border-left-color: var(--success, #78c9a0); }
article.turn.reasoning  { border-left-color: #a78bfa; opacity: .85; }
article.turn.system     { border-left-color: #9fb0a7; opacity: .7; }
article.turn.success, article.turn.done     { border-left-color: var(--success, #78c9a0); }
article.turn.error, article.turn.failed     { border-left-color: var(--fail, #f08b81); }
article.turn.running                        { border-left-color: var(--running, #efbb66); }
article.turn.blocked                        { border-left-color: #b58900; }
article.turn.cancelled                      { border-left-color: #9fb0a7; }
article.turn.completed                      { border-left-color: var(--success, #78c9a0); }
article.turn.submitted                      { border-left-color: var(--user, #7db0dd); }

.turn-meta {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  font-size: 11px; color: #9fb0a7;
}
.pill {
  font-size: 10px; padding: 1px 6px; border-radius: 20px;
  font-weight: 600; letter-spacing: .03em;
}
.pill.done, .pill.completed { background: #78c9a033; color: #78c9a0; }
.pill.running, .pill.submitted { background: #efbb6633; color: #efbb66; }
.pill.error, .pill.failed   { background: #f08b8133; color: #f08b81; }
.pill.blocked { background: #b5890033; color: #b58900; }
.pill.cancelled { background: #9fb0a733; color: #9fb0a7; }
.pill.tool { background: #d1a35c33; color: #d1a35c; }
.pill.terminal { background: #78c9a033; color: #78c9a0; }
.pill.reasoning { background: #a78bfa33; color: #a78bfa; }
.pill.system { background: #9fb0a733; color: #9fb0a7; }

.turn-body {
  font-size: 13.5px; line-height: 1.55; color: var(--text, #eef4f0);
  white-space: pre-wrap; word-break: break-word;
}

.tool.ok {
  margin-top: 6px; padding: 6px 8px; border-radius: 8px;
  background: #d1a35c22; border: 1px solid #d1a35c44;
}
.tool.ok .tool-head { display: flex; align-items: center; gap: 6px; }
.tool-icon { font-size: 10px; }
.tool-head span:last-child { font-size: 12px; color: #d1a35c; word-break: break-all; }
</style>
</head>
<body>
<div id="conv"></div>
<script>
(function () {
  var conv = document.getElementById('conv');

  // Escape HTML entities
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Map UiConversationItem.kind -> CSS class (user/tool/terminal/system).
  // The wire format from crates/freehand-ui-protocol::UiConversationItem is
  // { kind: "UserText"|"ToolSummary"|"Terminal"|"Reasoning"|"AssistantText"|"System",
  //   title: String, body: String, status: String }.
  // Keep this list aligned with the protocol enum; any unknown kind falls back
  // to "assistant" so the bridge never silently drops content.
  function kindToClass(kind) {
    switch (kind) {
      case 'UserText':     return 'user';
      case 'ToolSummary':  return 'tool';
      case 'ToolResult':   return 'tool';
      case 'Terminal':     return 'terminal';
      case 'Reasoning':    return 'reasoning';
      case 'AssistantText':return 'assistant';
      case 'System':       return 'system';
      default:             return 'assistant';
    }
  }

  // Render a single UiConversationItem as a card.
  function buildItemCard(item) {
    var el = document.createElement('article');
    var k = item.kind || 'AssistantText';
    var cls = kindToClass(k);
    var status = item.status || (k === 'Terminal' ? 'completed' : 'running');
    el.className = 'turn ' + cls + ' ' + status;
    var meta = '<div class="turn-meta">' +
      '<span>' + esc(item.title || k) + '</span>' +
      '<span class="pill ' + status + '">' + esc(status) + '</span>' +
      '</div>';
    el.innerHTML = meta + '<div class="turn-body">' + esc(item.body || '') + '</div>';
    return el;
  }

  // Render a UiTurnProjection as one or more cards. Uses the canonical
  // public_conversation array when present (it carries the per-item kind /
  // title / status), and falls back to the raw text fields for legacy shapes.
  function buildTurnCard(s) {
    var status = s.terminal_status || s.terminalStatus || 'running';
    var items = s.public_conversation || [];
    if (items.length) {
      return items.map(buildItemCard);
    }
    // Legacy fallback: build a single assistant card from raw text fields.
    var body = '';
    if (s.user_text) body += esc(s.user_text) + '\n';
    if (s.text && s.text.length) body += esc(s.text.join('\n')) + '\n';
    if (s.terminal_text) body += esc(s.terminal_text);
    var el = document.createElement('article');
    el.className = 'turn assistant ' + status;
    el.innerHTML = '<div class="turn-meta"><span>assistant</span>' +
      '<span class="pill ' + status + '">' + esc(status) + '</span></div>' +
      '<div class="turn-body">' + body + '</div>';
    return [el];
  }

  // Render a snapshot pushed from native.
  // Accepted shapes:
  //   { turn: UiTurnProjection, public_conversation: [] }  ← daemon wire shape
  //   { turns: [...] }                                    ← legacy flat
  //   null / empty                                        ← blank state
  function render(s) {
    if (!conv) return;
    conv.innerHTML = '';

    if (!s) {
      var d = document.createElement('div');
      d.className = 'day-sep';
      d.textContent = 'waiting for first turn';
      conv.appendChild(d);
      return;
    }

    // Legacy flat shape: { turns: [...] }
    if (s.turns && s.turns.length) {
      s.turns.forEach(function (t) {
        buildTurnCard(t).forEach(function (card) { conv.appendChild(card); });
      });
      conv.scrollTop = conv.scrollHeight;
      return;
    }

    // Canonical UiPublicTurnProjection shape from daemon.
    // The full { turn, public_conversation } shape is pushed as `s.turn`
    // and `s.public_conversation` at the top level of the snapshot.
    if (s.turn) {
      var turn = s.turn;
      var items = turn.public_conversation || [];
      if (items.length) {
        items.forEach(function (item) { conv.appendChild(buildItemCard(item)); });
      } else {
        buildTurnCard(turn).forEach(function (card) { conv.appendChild(card); });
      }
      conv.scrollTop = conv.scrollHeight;
      return;
    }
  }

  // Native pushes live snapshots here. Shape: UiSubscriptionEvent JSON.
  window.__freehand = {
    applySnapshot: function (s) {
      try { render(s); } catch (e) { console.error('[freehand] snapshot err', e); }
    }
  };

  // If a snapshot was pushed before the bridge was ready, consume it now.
  if (window.__freehandPending) {
    render(window.__freehandPending);
    window.__freehandPending = null;
  }
})();
</script>
</body>
</html>
