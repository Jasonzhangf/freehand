[package]
name = "freehand-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
freehand-blocks = { path = "../../crates/freehand-blocks" }
freehand-config = { path = "../../crates/freehand-config" }
freehand-contracts = { path = "../../crates/freehand-contracts" }
freehand-runtime = { path = "../../crates/freehand-runtime" }
freehand-reason = { path = "../../crates/freehand-reason" }
freehand-task = { path = "../../crates/freehand-task" }
freehand-node = { path = "../../crates/freehand-node" }
freehand-ui-protocol = { path = "../../crates/freehand-ui-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = { version = "1" }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
