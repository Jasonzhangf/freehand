[package]
name = "freehand-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
freehand-acp = { path = "../../crates/freehand-acp" }
agent-client-protocol = "2.0"
freehand-contracts = { path = "../../crates/freehand-contracts" }
freehand-relay = { path = "../../crates/freehand-relay" }
freehand-runtime = { path = "../../crates/freehand-runtime" }
freehand-server = { path = "../freehand-server" }
freehand-ui-protocol = { path = "../../crates/freehand-ui-protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
freehand-metadata = { path = "../../crates/freehand-metadata" }
freehand-task = { path = "../../crates/freehand-task" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serial_test = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
