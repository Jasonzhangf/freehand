[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
freehand-blocks = { path = "../crates/freehand-blocks" }
freehand-testkit = { path = "../crates/freehand-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-typescript = "0.23"
