<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Freehand Interactive Code Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f4f0;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #626b76;
      --line: #d6d3cb;
      --accent: #176d5c;
      --accent-soft: rgba(23, 109, 92, .1);
      --focus: #b45d17;
      --flow: #7a3e9d;
      --node: #fbfaf7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151719;
        --surface: #212428;
        --ink: #ededea;
        --muted: #a5aaaf;
        --line: #42484e;
        --accent: #69c2ab;
        --accent-soft: rgba(105, 194, 171, .14);
        --focus: #eda960;
        --flow: #c79ae8;
        --node: #272b30;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    header {
      padding: 28px max(24px, calc((100% - 1440px) / 2)) 18px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 600;
      letter-spacing: 0;
    }
    .lede {
      width: min(900px, 100%);
      margin: 10px 0 0;
      color: var(--muted);
    }
    .controls {
      display: flex;
      align-items: end;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    label {
      display: grid;
      gap: 5px;
      font-size: 13px;
      color: var(--muted);
    }
    select, input[type="search"], button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: inherit;
      font: inherit;
    }
    select, input[type="search"] { padding: 0 10px; min-width: 230px; }
    button { padding: 0 13px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    :is(select, input, button, svg g[role="button"]):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      gap: 18px;
      align-items: start;
      padding: 0 max(24px, calc((100% - 1440px) / 2)) 28px;
    }
    .canvas-shell, .inspector {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .canvas-shell { overflow-x: auto; }
    svg { display: block; width: 100%; height: auto; min-width: 1020px; }
    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.6;
      transition: opacity .18s ease, stroke .18s ease;
    }
    .edge.connected { stroke: var(--accent); stroke-width: 2.4px; }
    .edge.flow-path { stroke: var(--flow); stroke-width: 3px; }
    .edge.dimmed, .node.dimmed { opacity: .24; }
    .node rect {
      fill: var(--node);
      stroke: var(--line);
      stroke-width: 1px;
      rx: 7px;
      transition: fill .18s ease, stroke .18s ease, opacity .18s ease;
    }
    .node.selected rect { stroke: var(--accent); stroke-width: 2.5px; fill: var(--accent-soft); }
    .node.flow rect { stroke: var(--flow); stroke-width: 2.5px; }
    .node text { fill: var(--ink); pointer-events: none; }
    .node .node-name { font-size: 15px; font-weight: 650; }
    .node .node-kind { font-size: 11.5px; fill: var(--muted); }
    .node:hover rect { stroke: var(--accent); }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 18px; height: 2px; background: var(--line); }
    .swatch.connected { background: var(--accent); height: 3px; }
    .swatch.flow { background: var(--flow); height: 3px; }
    .inspector { padding: 20px; max-height: calc(100vh - 150px); overflow: auto; }
    .panel-title { margin: 0 0 4px; font-size: 20px; line-height: 1.25; font-weight: 650; }
    .kind {
      display: inline-block;
      margin-bottom: 14px;
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
    }
    h2 { margin: 20px 0 7px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    p, li, code { overflow-wrap: anywhere; }
    ul { margin: 0; padding-left: 20px; }
    .link-list { display: grid; gap: 6px; justify-items: start; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    a:hover { color: var(--focus); }
    .mini-node {
      border: 0; min-height: 0; padding: 0; background: transparent;
      cursor: pointer; color: var(--accent); font: inherit;
    }
    .mini-node::before { content: "→ "; color: var(--muted); }
    details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
    summary { cursor: pointer; color: var(--muted); }
    ol.flow-steps { padding-left: 0; list-style: none; counter-reset: flow; display: grid; gap: 3px; }
    .flow-step {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: start;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      min-height: 0;
      padding: 6px;
      cursor: pointer;
      text-align: left;
    }
    .flow-step.active {
      border-left-color: var(--flow);
      background: color-mix(in srgb, var(--flow) 10%, transparent);
    }
    .flow-step::before {
      counter-increment: flow;
      content: counter(flow);
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      font-size: 12px; display: grid; place-items: center;
    }
    .status { margin: 12px 0 0; min-height: 20px; color: var(--muted); }
    footer { padding: 0 24px 30px; color: var(--muted); font-size: 13px; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      header, .layout { padding-left: 16px; padding-right: 16px; }
      .controls { align-items: stretch; }
      label { flex: 1 1 240px; }
      .inspector { max-height: none; }
    }
    @media (max-width: 900px) {
      html, body { overscroll-behavior-y: contain; }
      body { padding-top: env(safe-area-inset-top); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
      header { padding-top: calc(20px + env(safe-area-inset-top)); }
      header, .layout, footer { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: clamp(24px, 7vw, 32px); }
      .controls { gap: 10px; margin-top: 14px; }
      label, select, input[type="search"], button { width: 100%; }
      select, input[type="search"] { min-width: 0; min-height: 46px; font-size: 16px; }
      button { min-height: 46px; font-size: 16px; }
      .canvas-shell { display: none; }
      #mobile-map { display: block; margin-bottom: 16px; }
      .mobile-toolbar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(112px, 1fr); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 0 2px 6px; }
      .mobile-page-btn {
        scroll-snap-align: center;
        border: 1px solid var(--line);
        background: var(--node);
        color: inherit;
        border-radius: 7px;
        min-height: 48px;
        padding: 8px 9px;
        display: grid;
        align-content: center;
        justify-items: start;
        text-align: left;
      }
      .mobile-page-btn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 650; }
      .mobile-cards { display: grid; gap: 9px; margin-top: 10px; }
      .mobile-node {
        width: 100%; min-height: 72px; border-radius: 8px; text-align: left;
        border: 1px solid var(--line); background: var(--node); color: inherit;
        padding: 11px 12px; display: grid; align-content: start; gap: 4px;
      }
      .mobile-node strong { font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
      .mobile-node span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
      .mobile-node.selected { border-color: var(--accent); background: var(--accent-soft); }
      .mobile-node.flow { border-color: var(--flow); }
      .mobile-node.dimmed { opacity: .28; }
      .mini-node { min-height: 44px; padding: 8px 0; }
      .flow-step { min-height: 44px; padding: 10px 6px; }
      .inspector { padding: 16px; border-radius: 8px; }
      footer { padding-bottom: max(24px, calc(20px + env(safe-area-inset-bottom))); }
    }
  </style>
</head>

          const x = 20 + pos[0] * 200;
          const y = 40 + pos[1] * 230;
          const group = element("g", {
            class: "node", tabindex: 0, role: "button",
            "data-node": node.id,
            "aria-label": `${node.name}: ${node.role}`
          });
          group.append(element("rect", { x, y, width: 180, height: 150, rx: 7 }));
          wrappedText(group, node.name, x + 15, y + 35, 17, "node-name");
          group.appendChild(element("text", { x: x + 15, y: y + 122, class: "node-kind" }, `${node.kind} · ${node.ownerFeature.split(";")[0].trim()}`));
          group.addEventListener("click", () => selectNode(node.id));
          group.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(node.id); }
          });
          host.append(group);
          nodeEls.set(node.id, group);
        }
      }

      function section(title, value) {
        if (!value || (Array.isArray(value) && !value.length)) return "";
        return `<h2>${escapeHtml(title)}</h2><div>${value}</div>`;
      }

      function list(items) {
        return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function linkList(paths) {
        return `<div class="link-list">${paths.map(path => fileLink(path)).join("")}</div>`;
      }

      function evidenceList(evidence) {
        return `<div class="link-list">${evidence.map(item => fileLink(item.path, item.lines?.[0])).join("")}</div>`;
      }

      function relatedNodes(ids) {
        const valid = ids.filter(id => nodesById.has(id));
        if (!valid.length) return "<p>无首屏主节点直接上游。</p>";
        return `<div class="chip-list">${valid.map(id =>
          `<button class="mini-node" type="button" data-select="${id}">${escapeHtml(nodesById.get(id).name)}</button>`
        ).join("")}</div>`;
      }

      function renderOverview() {
        document.getElementById("detail").innerHTML = `
          <p class="panel-title">地图总览</p>
          <span class="kind">18 primary nodes</span>
          <p>${escapeHtml(DATA.summary.role)}</p>
          ${section("主数据流", `<p>${escapeHtml(DATA.summary.primaryFlow)}</p>`)}
          ${section("支撑资源", resources.map(resource =>
            `<p><strong>${escapeHtml(resource.name)}</strong> · ${escapeHtml(resource.kind)}<br><span>${escapeHtml(resource.truth)}</span></p>`
          ).join(""))}
          <details><summary>验证口径</summary><p>每个节点保留 owner、source symbol、tests 与 project map 链接；codemap.lock 记录当前源码哈希。</p></details>
        `;
      }

      function renderNode(node) {
        document.getElementById("detail").innerHTML = `
          <p class="panel-title">${escapeHtml(node.name)}</p>
          <span class="kind">${escapeHtml(node.kind)} · ${escapeHtml(node.layer)}</span>
          <p>${escapeHtml(node.role)}</p>
          ${section("Owner", `<code>${escapeHtml(node.ownerFeature)}</code>`)}
          ${section("路径", linkList(node.paths))}
          ${section("上游调用者", relatedNodes(node.upstream))}
          ${section("依赖 / 下游", relatedNodes(node.downstream))}
          ${section("数据流", `<p>${escapeHtml(node.dataFlow)}</p>`)}
          ${section("下游影响", `<p>${escapeHtml(node.impact)}</p>`)}
          ${section("子模块分组", list(node.submodules))}
          ${section("源码证据", evidenceList(node.sourceEvidence))}
          ${section("测试证据", list(node.tests))}
          ${section("项目映射", linkList(node.maps))}
        `;
      }

      function clearHighlights() {
        nodeEls.forEach(el => el.classList.remove("selected", "flow", "dimmed"));
        edgeEls.forEach(el => el.classList.remove("connected", "flow-path", "dimmed"));
        document.querySelectorAll("#mobile-map .mobile-node").forEach(el =>
          el.classList.remove("selected", "flow", "dimmed")
        );
      }

      function selectNode(id, announce = true) {
        selectedId = id;
        activeFlow = "";
        document.getElementById("flow-select").value = "";
        clearHighlights();
        const node = nodesById.get(id);
        if (!node) return;
        nodeEls.get(id).classList.add("selected");
        for (const [edgeId, edge] of edgeEls) {
          const source = edges.find(item => item.id === edgeId);
          if (source.from === id || source.to === id) edge.classList.add("connected");
          else edge.classList.add("dimmed");
        }
        nodeEls.forEach((el, nodeId) => {
          const related = nodeId === id || node.upstream.includes(nodeId) || node.downstream.includes(nodeId);
          if (!related) el.classList.add("dimmed");
        });
        document.querySelectorAll("#mobile-map .mobile-node").forEach(el => {
          const nodeId = el.dataset.node;
          if (nodeId !== id && !node.upstream.includes(nodeId) && !node.downstream.includes(nodeId)) el.classList.add("dimmed");
        });
        renderNode(node);
        document.querySelectorAll("#mobile-map .mobile-node").forEach(el => {
          const nodeId = el.dataset.node;
          el.classList.toggle("selected", nodeId === id);
        });
        document.getElementById("status").textContent = announce ? `已选择 ${node.name}` : "";
      }

      function selectFlow(flowId) {
        activeFlow = flowId;
        mobileQuery = "";
        selectedId = "";
        clearHighlights();
        const flow = flows.find(item => item.id === flowId);
        if (!flow) return;
        const sequence = flow.steps.map(step => step.node).filter(id => nodeEls.has(id));
        new Set(sequence).forEach(id => nodeEls.get(id).classList.add("flow"));
        flow.steps.forEach(step => {
          if (!nodesById.has(step.node)) return;
          document.querySelector(`#mobile-map .mobile-node[data-node="${step.node}"]`)?.classList.add("flow");
        });
        flow.steps.forEach((step, index) => {
          if (!index) return;
          const previous = flow.steps[index - 1];
          const match = edges.find(edge =>
            (edge.from === previous.node && edge.to === step.node) ||
            (edge.from === step.node && edge.to === previous.node)
          );
          if (match) edgeEls.get(match.id)?.classList.add("flow-path");
        });
        document.querySelectorAll("#mobile-map .mobile-node").forEach(el => {
          const stepNode = el.dataset.node;
          el.classList.toggle("flow", flow.steps.some(step => step.node === stepNode));
        });
        const steps = flow.steps.map((step, index) => {
          const name = nodesById.get(step.node)?.name || resources.find(item => item.id === step.node)?.name || step.node;
          return `<li><button class="flow-step" type="button" data-flow-index="${index}" data-node="${nodesById.has(step.node) ? step.node : ""}">
            <span><strong>${escapeHtml(name)}</strong><br>${escapeHtml(step.action)}</span>
          </button></li>`;
        }).join("");
        document.getElementById("detail").innerHTML = `
          <p class="panel-title">${escapeHtml(flow.name)}</p>
          <span class="kind">${flow.steps.length} steps</span>
          <ol class="flow-steps">${steps}</ol>
          ${section("证据", `<div class="link-list">${flow.evidence.map(item => {
            const at = item.lastIndexOf(":");
            return fileLink(item.slice(0, at), item.slice(at + 1));
          }).join("")}</div>`)}
        `;
        document.getElementById("status").textContent = `已高亮 ${flow.name}`;
        if (window.matchMedia("(max-width: 900px)").matches) renderMobileMap();
      }

      function applySearch(query) {
        const needle = query.trim().toLowerCase();
        mobileQuery = needle;
        clearHighlights();
        selectedId = "";
        activeFlow = "";
        document.getElementById("flow-select").value = "";
        if (!needle) { renderOverview(); document.getElementById("status").textContent = ""; return; }
        let matches = 0;
        nodeEls.forEach((el, id) => {
          const node = nodesById.get(id);
          const haystack = JSON.stringify(node).toLowerCase();
          const matched = haystack.includes(needle);
          el.classList.toggle("dimmed", !matched);
          if (matched) matches += 1;
        });
        edgeEls.forEach(el => el.classList.add("dimmed"));
        document.querySelectorAll("#mobile-map .mobile-node").forEach(el => {
          const node = nodesById.get(el.dataset.node);
          const matched = JSON.stringify(node).toLowerCase().includes(needle);
          el.classList.toggle("dimmed", !matched);
        });
        if (needle && window.matchMedia("(max-width: 900px)").matches) {
          const matchPage = mobilePages.findIndex(page => page.ids.some(id =>
            JSON.stringify(nodesById.get(id)).toLowerCase().includes(needle)
          ));
          if (matchPage >= 0) activeMobilePage = matchPage;
          renderMobileMap();
        }
        document.getElementById("detail").innerHTML = `<p class="panel-title">搜索</p><span class="kind">${matches} matching primary nodes</span><p>匹配范围包括角色、owner、路径、子模块、测试与项目映射。</p>`;
        document.getElementById("status").textContent = `${matches} 个主节点匹配 “${query.trim()}”`;
      }

      const mobilePages = [
        { title: "运行面", ids: ["android-client", "webui-server", "ui-protocol", "daemon-host", "relay-transport"] },
        { title: "编排与推理", ids: ["runtime-bridge", "reason-engine", "provider-core"] },
        { title: "Provider 与工具", ids: ["provider-openai", "provider-anthropic", "tools-registry"] },
        { title: "任务与拓扑", ids: ["task-lifecycle", "node-topology", "config-core"] },
        { title: "契约与观测", ids: ["contracts-core", "instructions-loader", "observability"] }
      ];
      let activeMobilePage = 0;

      function renderMobileMap() {
        const host = document.getElementById("mobile-map");
        if (!host) return;
        host.innerHTML = "";
        const toolbar = document.createElement("div");
        toolbar.className = "mobile-toolbar";
        mobilePages.forEach((page, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "mobile-page-btn";
          button.textContent = page.title;
          button.setAttribute("aria-current", index === activeMobilePage ? "true" : "false");
          button.addEventListener("click", () => {
            activeMobilePage = index;
            renderMobileMap();
          });
          toolbar.append(button);
        });
        const cards = document.createElement("div");
        cards.className = "mobile-cards";
        mobilePages[activeMobilePage].ids.forEach(id => {
          const node = nodesById.get(id);
          if (!node) throw new Error(`missing mobile map node: ${id}`);
          const flow = activeFlow ? flows.find(item => item.id === activeFlow) : null;
          const isFlowNode = Boolean(flow?.steps.some(step => step.node === id));
          const button = document.createElement("button");
          button.type = "button";
          const matched = !mobileQuery || JSON.stringify(node).toLowerCase().includes(mobileQuery);
          button.className = `mobile-node ${selectedId === id ? "selected" : ""} ${isFlowNode ? "flow" : ""} ${matched ? "" : "dimmed"}`;
          button.dataset.node = id;
          button.setAttribute("aria-label", `${node.name}: ${node.role}`);
          button.innerHTML = `<strong>${escapeHtml(node.name)}</strong><span>${escapeHtml(node.kind)} · ${escapeHtml(node.ownerFeature.split(";")[0].trim())}</span>`;
          button.addEventListener("click", () => selectNode(id));
          cards.append(button);
        });
        host.append(toolbar, cards);
      }

      function syncMobileVisibility() {
        const mobileHost = document.getElementById("mobile-map");
        const desktopHost = document.querySelector(".layout > section[aria-label=\"代码模块图\"]");
        if (window.matchMedia("(max-width: 900px)").matches) {
          mobileHost.hidden = false;
          desktopHost.hidden = true;
          renderMobileMap();
        } else {
          mobileHost.hidden = true;
          desktopHost.hidden = false;
        }
      }

      function init() {
        if (nodes.length > (DATA.constraints?.primaryNodeLimit || 20)) throw new Error("primary node limit exceeded");
        for (const edge of edges) {
          const primaryIds = new Set(nodes.map(node => node.id));
          const resourceIds = new Set(resources.map(resource => resource.id));
          for (const endpoint of [edge.from, edge.to]) {
            if (!primaryIds.has(endpoint) && !resourceIds.has(endpoint)) throw new Error(`unknown edge endpoint: ${endpoint}`);
          }
        }
        renderEdges();
        renderNodes();
        renderOverview();
        document.getElementById("revision").textContent = `${DATA.sourceRevision.branch}@${DATA.sourceRevision.commit.slice(0, 12)}`;
        const flowSelect = document.getElementById("flow-select");
        flows.forEach(flow => {
          const option = document.createElement("option");
          option.value = flow.id;
          option.textContent = flow.name;
          flowSelect.append(option);
        });
        flowSelect.addEventListener("change", () => selectFlow(flowSelect.value));
        document.getElementById("search").addEventListener("input", event => applySearch(event.target.value));
        document.getElementById("reset").addEventListener("click", () => {
          flowSelect.value = "";
          document.getElementById("search").value = "";
          clearHighlights();
          selectedId = "";
          activeFlow = "";
          mobileQuery = "";
          renderOverview();
          if (window.matchMedia("(max-width: 900px)").matches) renderMobileMap();
          document.getElementById("status").textContent = "视图已重置";
        });
        document.getElementById("detail").addEventListener("click", event => {
          const selector = event.target.closest("[data-select]");
          if (selector) selectNode(selector.dataset.select);
          const step = event.target.closest("[data-flow-index]");
          if (step) {
            document.querySelectorAll(".flow-step.active").forEach(item => item.classList.remove("active"));
            step.classList.add("active");
            if (step.dataset.node) selectNode(step.dataset.node, false);
            const flow = flows.find(item => item.id === activeFlow);
            if (flow) {
              const current = flow.steps[Number(step.dataset.flowIndex)];
              document.getElementById("status").textContent = `流程步骤：${current.action}`;
            }
          }
        });
        window.addEventListener("resize", syncMobileVisibility, { passive: true });
        syncMobileVisibility();
      }

      try { init(); }
      catch (error) {
        document.getElementById("detail").innerHTML = `<p class="panel-title">地图数据错误</p><code>${escapeHtml(error.message)}</code>`;
        document.getElementById("status").textContent = error.message;
        throw error;
      }
    })();
  </script>
</body>
</html>
