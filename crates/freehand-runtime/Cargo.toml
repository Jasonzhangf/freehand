[package]
name = "freehand-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
freehand-blocks = { path = "../freehand-blocks" }
freehand-config = { path = "../freehand-config" }
freehand-control = { path = "../freehand-control" }
freehand-contracts = { path = "../freehand-contracts" }
freehand-debug = { path = "../freehand-debug" }
freehand-instructions = { path = "../freehand-instructions" }
freehand-metadata = { path = "../freehand-metadata" }
freehand-node = { path = "../freehand-node" }
freehand-provider-anthropic = { path = "../freehand-provider-anthropic" }
freehand-provider-core = { path = "../freehand-provider-core" }
freehand-provider-openai = { path = "../freehand-provider-openai" }
freehand-reason = { path = "../freehand-reason" }
freehand-task = { path = "../freehand-task" }
freehand-tools = { path = "../freehand-tools" }
freehand-ui-protocol = { path = "../freehand-ui-protocol" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
